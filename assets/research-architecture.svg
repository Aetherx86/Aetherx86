  <text x="634" y="270" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">VMP_DEVIRT · Hexane · Obsidian</text>

  <!-- Pillar 4 -->
  <rect x="912" y="136" width="264" height="150" rx="12" fill="#0B1324" stroke="#10B981" stroke-opacity="0.5"/>
  <rect x="912" y="136" width="264" height="4" rx="2" fill="#10B981"/>
  <text x="930" y="166" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="700">Agentic Systems &amp; DevTools</text>
  <g fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
