  </g>
  <text x="42" y="270" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">zk-hyperVM · holynix · Zircon</text>

  <!-- Pillar 2 -->
  <rect x="320" y="136" width="264" height="150" rx="12" fill="#0B1324" stroke="#8B5CF6" stroke-opacity="0.5"/>
  <rect x="320" y="136" width="264" height="4" rx="2" fill="#8B5CF6"/>
  <text x="338" y="166" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="700">Verifiable Proofs &amp; PQC</text>
  <g fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
