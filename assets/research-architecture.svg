  <text x="338" y="270" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">medcrypto · Pyrope · Tanzanite</text>

  <!-- Pillar 3 -->
  <rect x="616" y="136" width="264" height="150" rx="12" fill="#0B1324" stroke="#F59E0B" stroke-opacity="0.5"/>
  <rect x="616" y="136" width="264" height="4" rx="2" fill="#F59E0B"/>
  <text x="634" y="166" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="700">De-virtualization &amp; Compilers</text>
  <g fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
