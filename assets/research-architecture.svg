<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-label="Research Architecture — Formal Verifiability and Four Investigation Pillars">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="rootBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="310" rx="14" fill="url(#bg2)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Root node -->
  <rect x="330" y="22" width="540" height="54" rx="12" fill="#0B1324" stroke="url(#rootBorder)" stroke-width="2"/>
  <text x="600" y="46" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="700">Formal Verifiability &amp; Mathematical Rigor</text>
  <text x="600" y="65" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">Deterministic Proofs · Zero-Warning Toolchains · Reproducible Artifacts</text>

  <!-- Connector bus -->
  <path d="M 600 76 L 600 104 M 156 104 L 1044 104 M 156 104 L 156 128 M 452 104 L 452 128 M 748 104 L 748 128 M 1044 104 L 1044 128" fill="none" stroke="#334155" stroke-width="2"/>
  <circle cx="156" cy="128" r="4" fill="#06B6D4"/>
  <circle cx="452" cy="128" r="4" fill="#8B5CF6"/>
  <circle cx="748" cy="128" r="4" fill="#F59E0B"/>
  <circle cx="1044" cy="128" r="4" fill="#10B981"/>

  <!-- Pillar 1 -->
  <rect x="24" y="136" width="264" height="150" rx="12" fill="#0B1324" stroke="#06B6D4" stroke-opacity="0.5"/>
  <rect x="24" y="136" width="264" height="4" rx="2" fill="#06B6D4"/>
  <text x="42" y="166" fill="#22D3EE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="700">Hardware Virtualization</text>
  <g fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
