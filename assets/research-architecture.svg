    <text x="930" y="217">▸ Typed Graph Memory &amp; Leases</text>
    <text x="930" y="240">▸ Visual Browser Workbenches</text>
  </g>
  <text x="930" y="270" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">context-budget-orchestrator · Labs</text>
