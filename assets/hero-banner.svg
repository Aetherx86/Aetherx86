<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-label="Jeong Hoon (Jeffrey) Kim — Systems Security, Applied Cryptography, and AI Orchestration">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="55%" stop-color="#0B1324"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="18%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="85%" cy="78%" r="45%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="270" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="270" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="270" rx="16" fill="url(#glowCyan)"/>
  <rect width="1200" height="270" rx="16" fill="url(#glowViolet)"/>
  <rect x="1" y="1" width="1198" height="268" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="0" y="0" width="1200" height="3" rx="1.5" fill="url(#accentLine)"/>

  <!-- Top terminal status bar -->
  <circle cx="34" cy="28" r="5" fill="#F43F5E" fill-opacity="0.85"/>
  <circle cx="52" cy="28" r="5" fill="#F59E0B" fill-opacity="0.85"/>
  <circle cx="70" cy="28" r="5" fill="#10B981" fill-opacity="0.85"/>
  <text x="92" y="32" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">aetherx86@hanyang-lab ~ /systems-security-and-verifiable-compute</text>

  <rect x="975" y="16" width="195" height="24" rx="12" fill="#0F172A" stroke="#1E293B"/>
  <circle cx="991" cy="28" r="4" fill="#10B981"/>
  <text x="1003" y="32" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">SEOUL, KR · OPEN TO COLLAB</text>

  <!-- Main identity -->
  <text x="48" y="106" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.8">Jeong Hoon (Jeffrey) Kim</text>
  <text x="50" y="138" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600">Systems Security  ·  Applied Cryptography  ·  Verifiable Computation  ·  AI Orchestration</text>
  <text x="50" y="166" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14">Department of Computer Science &amp; Systems, Hanyang University  —  Laboratory for High-Assurance Systems</text>

  <!-- Pill badges bottom-left -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">
    <rect x="48" y="194" width="156" height="30" rx="8" fill="#0C192C" stroke="#06B6D4" stroke-opacity="0.55"/>
    <text x="64" y="213" fill="#22D3EE">Microhypervisors</text>

    <rect x="216" y="194" width="144" height="30" rx="8" fill="#17122B" stroke="#8B5CF6" stroke-opacity="0.55"/>
    <text x="232" y="213" fill="#A78BFA">ZK-IVC Folding</text>

    <rect x="372" y="194" width="154" height="30" rx="8" fill="#1D160B" stroke="#F59E0B" stroke-opacity="0.55"/>
    <text x="388" y="213" fill="#FBBF24">De-virtualization</text>

    <rect x="538" y="194" width="168" height="30" rx="8" fill="#0A1F18" stroke="#10B981" stroke-opacity="0.55"/>
    <text x="554" y="213" fill="#34D399">Agentic Tooling</text>
  </g>

  <!-- Right metric cards -->
  <g>
    <rect x="820" y="64" width="166" height="82" rx="12" fill="#0F172A" fill-opacity="0.9" stroke="#1E293B"/>
    <text x="838" y="92" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">PUBLIC REPOS</text>
    <text x="838" y="128" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="30" font-weight="800">63</text>
    <text x="884" y="126" fill="#10B981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">open-source</text>

    <rect x="1002" y="64" width="166" height="82" rx="12" fill="#0F172A" fill-opacity="0.9" stroke="#1E293B"/>
    <text x="1020" y="92" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">LIVE WORKBENCHES</text>
    <text x="1020" y="128" fill="#22D3EE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="30" font-weight="800">13+</text>
    <text x="1078" y="126" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">browser UI</text>

    <rect x="820" y="158" width="348" height="66" rx="12" fill="#0F172A" fill-opacity="0.9" stroke="#1E293B"/>
    <text x="838" y="183" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">CORE SYSTEMS STACK</text>
    <text x="838" y="207" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">Rust · C++ · Zig · TS · Go · Kotlin · Python · Wasm</text>
